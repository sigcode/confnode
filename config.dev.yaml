server:
  port: 3001
  secret: "dev-secret-not-for-production-use-only-32chars"

apache:
  mode: debian
  sites_available: /tmp/confnode-dev/sites-available
  sites_enabled: /tmp/confnode-dev/sites-enabled
  default_webroot: /tmp/confnode-dev/www

php:
  versions: ["8.1", "8.3", "8.4"]
  default: "8.4"
  fpm_units:
    "8.4": "php-fpm"  # Arch official package has no version number

certbot:
  email: dev@localhost

git:
  # ssh_key: /root/.ssh/id_ed25519

database:
  path: /tmp/confnode-dev/db.sqlite

agent:
  socket: /tmp/confnode-dev/agent.sock
